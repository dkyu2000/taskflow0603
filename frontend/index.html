<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow · 업무 관리</title>
  <!-- 규칙: CSS 직접 작성 금지, Tailwind CDN 만 사용 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <header class="mb-6">
      <h1 class="text-3xl font-bold text-slate-900">📋 TaskFlow</h1>
      <p class="text-slate-500 mt-1">업무를 추가하고 상태를 관리하세요.</p>
    </header>

    <!-- 업무 추가 폼 -->
    <form id="taskForm" class="bg-white rounded-xl shadow p-4 mb-8 flex flex-col gap-3 sm:flex-row sm:items-end">
      <div class="flex-1">
        <label class="block text-sm font-medium text-slate-600 mb-1" for="titleInput">업무명</label>
        <input id="titleInput" type="text" required maxlength="200"
               placeholder="예) 기획서 초안 작성"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1" for="priorityInput">우선순위</label>
        <select id="priorityInput"
                class="border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <option value="low">낮음</option>
          <option value="medium" selected>보통</option>
          <option value="high">높음</option>
        </select>
      </div>
      <button type="submit"
              class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg px-5 py-2 transition-colors">
        추가
      </button>
    </form>

    <!-- 칸반 보드: 대기 / 진행중 / 완료 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <section class="bg-slate-200/60 rounded-xl p-3">
        <h2 class="font-semibold text-slate-700 mb-3 flex items-center justify-between">
          <span>🕘 대기</span>
          <span id="countTodo" class="text-xs bg-slate-300 rounded-full px-2 py-0.5">0</span>
        </h2>
        <div id="colTodo" class="flex flex-col gap-3 min-h-[80px]"></div>
      </section>

      <section class="bg-amber-100/60 rounded-xl p-3">
        <h2 class="font-semibold text-slate-700 mb-3 flex items-center justify-between">
          <span>🔧 진행중</span>
          <span id="countDoing" class="text-xs bg-amber-300 rounded-full px-2 py-0.5">0</span>
        </h2>
        <div id="colDoing" class="flex flex-col gap-3 min-h-[80px]"></div>
      </section>

      <section class="bg-emerald-100/60 rounded-xl p-3">
        <h2 class="font-semibold text-slate-700 mb-3 flex items-center justify-between">
          <span>✅ 완료</span>
          <span id="countDone" class="text-xs bg-emerald-300 rounded-full px-2 py-0.5">0</span>
        </h2>
        <div id="colDone" class="flex flex-col gap-3 min-h-[80px]"></div>
      </section>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
